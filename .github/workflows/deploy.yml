name: Publier le Calculateur MCR

on:

  push:

    branches: [main]

  workflow_dispatch:

permissions:

  contents: read

  pages: write

  id-token: write

concurrency:

  group: pages

  cancel-in-progress: false

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Recuperer les fichiers

        uses: actions/checkout@v4

      - name: Decompresser le calculateur

        run: |

          mkdir -p site

          unzip -q Calculateur_MCR_V12_GitHub_Pages.zip -d site

          test -f site/index.html

      - name: Configurer GitHub Pages

        uses: actions/configure-pages@v5

      - name: Preparer le site

        uses: actions/upload-pages-artifact@v4

        with:

          path: site

      - name: Publier le site

        id: deployment

        uses: actions/deploy-pages@v4
